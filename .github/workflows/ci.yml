name: Splitlery PR verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: splitlery-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify core, web, mobile, and web build
        run: npm run verify
